# The gates of this repository, run on GitHub — the second caller of the self-test
# gate this repository's .githooks/pre-push runs locally (ADR-055, ADR-060).
#
# This repository ships no package: every application is a sub-repo with gates of
# its own. What it does own are the cross-repo checks under scripts/, and their
# self-tests are hermetic: each builds a tree under `mktemp -d`, so no submodule
# is checked out here.
#
# `required_status_checks` on main names the `gates` job below, which is why the job
# id must not be renamed: the branch protection rule on every repository refers to
# it by that exact string.
#
# ⚠️ YAML forbids tabs.
#
# ⚠️ Every `uses:` is pinned to a commit SHA, not a tag: Scorecard's
# Pinned-Dependencies check grades this file too, and a tag is mutable.
#
# The other pre-push gate, the Scorecard floor, has its own workflow
# (scorecard.yml) and grades the repository rather than a diff.
name: Gates

on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  gates:
    name: gates
    # The organisation's own self-hosted runners, any of them (owner, 2026-11-28, ADR-061).
    # Never a GitHub-hosted label.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Gate 1 - cross-repo check self-tests
        run: |
          shopt -s nullglob
          selftests=(scripts/*-selftest.sh)
          [ "${#selftests[@]}" -gt 0 ]
          for selftest in "${selftests[@]}"; do
            "./$selftest"
          done
