# A three-node MongoDB replica set for local development, plus an optional Redis.
#
# Member hostnames are mdb1/mdb2/mdb3 and each node listens on its OWN port. That is not decoration:
# a replica set advertises its members by the host:port written into its config, and the driver
# dials those, not the address you handed it. With all three on 27017 the host could not tell them
# apart through 127.0.0.1, so the second and third members would be unreachable from outside Docker
# and every read with a non-primary preference would hang. Distinct ports let one /etc/hosts line
# per name resolve correctly on both sides of the network boundary — see README.md §Prerequisites.

# ⚠️ The project name prefixes the volumes (marketplace-dbs_mdb1 …) and the network. Changing it does
# not migrate them: compose simply stops seeing the old ones, and a cluster that had data comes back
# empty with its users gone. Purge first, or move the volumes by hand.
name: marketplace-dbs

# ⚠️ Every service below carries this. Docker's default is `json-file` with an EMPTY options
# object, which never rotates: `marketplace-mdb1` was measured at 458,129 lines / 229 MiB over 52
# hours of ordinary development — 4.6 MB/h — and the only thing that would ever have stopped it is
# the filesystem filling up.
#
# 20m x 5 caps one container at 100 MiB and this four-container stack at 400 MiB. At mdb1's measured
# rate that is roughly the last 22 hours: one working day, which is the window a developer actually
# reads back. The other three wrote 2.8 MiB, 4.2 MiB and 9 KiB over the same 52 hours, so for them
# the same numbers mean "never rotates" and cost nothing — the pair is sized for the loud one.
#
# ⚠️ Rotation is not retention. This bounds how BIG a log may get; it decides nothing about how long
# its content may be kept. The 14-day answer of 2026-08-11 is the edge's; no period has
# been decided for these container logs, and this file does not invent one.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

x-mongod: &mongod
  image: marketplace-mongod:${MONGO_TAG:-8.0}
  build:
    context: .
    args:
      MONGO_TAG: ${MONGO_TAG:-8.0}
  restart: unless-stopped
  logging: *logging
  networks: [dbs]

services:
  mdb1:
    <<: *mongod
    container_name: marketplace-mdb1
    command: [mongod, --replSet, rs0, --keyFile, /etc/mongo/keyfile, --bind_ip_all, --port, '27017']
    ports: ['127.0.0.1:27017:27017']
    volumes: [mdb1:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --port, '27017', --eval, "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mdb2:
    <<: *mongod
    container_name: marketplace-mdb2
    command: [mongod, --replSet, rs0, --keyFile, /etc/mongo/keyfile, --bind_ip_all, --port, '27018']
    ports: ['127.0.0.1:27018:27018']
    volumes: [mdb2:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --port, '27018', --eval, "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  mdb3:
    <<: *mongod
    container_name: marketplace-mdb3
    command: [mongod, --replSet, rs0, --keyFile, /etc/mongo/keyfile, --bind_ip_all, --port, '27019']
    ports: ['127.0.0.1:27019:27019']
    volumes: [mdb3:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --port, '27019', --eval, "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  # Opt-in: `./up.sh --with-redis`. The nine services keep their sessions here, so the platform does
  # not boot without one — but a dev who already has a Redis wants this container to stay down.
  redis:
    image: redis:${REDIS_TAG:-7.4-alpine}
    container_name: marketplace-redis
    profiles: [redis]
    restart: unless-stopped
    logging: *logging
    # ⚠️ The password used to be interpolated straight into this `command:`, which put it in
    # the container's argv — `docker inspect`, `docker ps --no-trunc` and a plain host `ps aux` all
    # handed it to any user on the machine. It now arrives in a config file that `up.sh` generates
    # from `.env` into `secrets/` (git-ignored) and that is mounted read-only, so argv is
    # `redis-server <path>` and nothing else. `appendonly yes` moved into that file with it: one
    # source for the server's configuration rather than two.
    #
    # ⚠️ That file is mode 444, not 400. redis-server reads it as uid 999 inside the container,
    # through a bind mount the daemon sets up as root, and a 400 file owned by the host user is
    # `Fatal error, can't open config file` there. What keeps it private on the host is the 700 on
    # `secrets/` — the container's path does not traverse that directory, so the two do not conflict.
    #
    # ⚠️ Do not run `docker compose --profile redis up` by hand before `./up.sh --with-redis` has
    # written the file: Docker creates a DIRECTORY for a missing bind-mount source, and redis-server
    # then dies on it every start until that directory is removed.
    command: [redis-server, /usr/local/etc/redis/redis.conf]
    ports: ['127.0.0.1:6379:6379']
    volumes:
      - redis:/data
      - ./secrets/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [dbs]

networks:
  dbs:
    name: marketplace-dbs

volumes:
  mdb1:
  mdb2:
  mdb3:
  redis:
